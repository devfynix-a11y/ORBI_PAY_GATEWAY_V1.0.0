name: Deploy ORBI Pay Gateway To Self Hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: orbi-pay-gateway-self-hosted
  cancel-in-progress: false

env:
  APP_ENV_FILE: /etc/orbi/pay-gateway.env
  IMAGE_NAME: orbi-pay-gateway
  CONTAINER_NAME: orbi-pay-gateway
  APP_PORT: "3100"

jobs:
  deploy:
    name: Build And Deploy On Self Hosted Host
    runs-on:
      - self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate private runtime file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APP_ENV_FILE" ]; then
            echo "::error::Missing $APP_ENV_FILE. Create it on the self-hosted runtime before deploying."
            exit 1
          fi

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_NAME:${GITHUB_SHA}" -t "$IMAGE_NAME:latest" .

      - name: Deploy container
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$APP_ENV_FILE" \
            -p "$APP_PORT:3100" \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/health" >/tmp/orbi-pay-health.json; then
              cat /tmp/orbi-pay-health.json
              exit 0
            fi
            sleep 2
          done

          docker logs --tail=120 "$CONTAINER_NAME" || true
          exit 1
