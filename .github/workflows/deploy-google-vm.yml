name: Deploy ORBI Pay Gateway To Google VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: orbi-pay-gateway-google-vm
  cancel-in-progress: false

env:
  APP_DIR: /home/auth_fynix/apps/orbi-pay-gateway
  IMAGE_NAME: orbi-pay-gateway
  CONTAINER_NAME: orbi-pay-gateway
  APP_PORT: "3100"
  M_TLS_DIR: /opt/orbi/mtls

jobs:
  deploy:
    name: Build And Deploy On Google VM
    runs-on:
      - self-hosted
      - linux
      - google

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VM private runtime files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$APP_DIR"

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "::error::Missing $APP_DIR/.env. Create it on the VM from the private Pay Gateway variables file before deploying."
            exit 1
          fi

          for file in \
            "$M_TLS_DIR/orbi-internal-ca.crt" \
            "$M_TLS_DIR/pay-gateway-client.crt" \
            "$M_TLS_DIR/pay-gateway-client.key"
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing mTLS file: $file"
              exit 1
            fi
          done

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_NAME:${GITHUB_SHA}" -t "$IMAGE_NAME:latest" .

      - name: Deploy container
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            -p "$APP_PORT:3100" \
            -v "$M_TLS_DIR:$M_TLS_DIR:ro" \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/health" >/tmp/orbi-pay-health.json; then
              cat /tmp/orbi-pay-health.json
              exit 0
            fi
            sleep 2
          done

          docker logs --tail=120 "$CONTAINER_NAME" || true
          exit 1

