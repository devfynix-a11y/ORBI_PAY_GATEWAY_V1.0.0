name: Pay Gateway CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: pay-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-and-contracts:
    name: Service, Contracts, And SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Node SDK dependencies
        run: npm --prefix sdk/node ci

      - name: Build service
        run: npm run build

      - name: Run service tests
        run: npm test

      - name: Check OpenAPI contract
        run: npm run openapi:check

      - name: Check SDK release metadata
        run: npm run sdk:metadata:check

      - name: Check Node SDK
        run: npm run sdk:node:check

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python SDK tests
        run: python -m unittest discover -s sdk/python/tests

      - name: Build Python SDK package
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python

  php-sdk:
    name: PHP SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          tools: composer:v2

      - name: Validate Composer package
        working-directory: sdk/php
        run: composer validate --strict

      - name: PHP syntax check
        run: find sdk/php/src -name '*.php' -print0 | xargs -0 -n1 php -l
